<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>apple run</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: "DrawvidHand";
        src: url("assets/fonts/DrawvidHandwriting.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        /* Pinned to the visible screen edges, as in index.html. */
        position: fixed;
        inset: 0;
        background: #4d78bd;
        color: #fff;
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      #hud,
      #menu {
        position: absolute;
        top: 12px;
        font-size: clamp(18px, 5vw, 26px);
      }
      #hud {
        left: 14px;
        pointer-events: none;
      }
      #menu {
        right: 14px;
        color: #fff;
        text-decoration: none;
      }
      /* What to do / how it went, mid-screen. */
      #msg {
        position: absolute;
        top: 30%;
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: clamp(22px, 6.5vw, 34px);
        line-height: 1.3;
        white-space: pre-line;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="hud"></div>
    <a id="menu" href="./">Menu</a>
    <div id="msg"></div>

    <script src="node_modules/babylonjs/babylon.js"></script>
    <script src="node_modules/babylonjs-loaders/babylonjs.loaders.min.js"></script>
    <script src="sliceBurst.js"></script>
    <script src="run.js"></script>
  </body>
</html>
