<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale: no iOS zoom-in when the name box is focused -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>apple royale</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Top left: the Menu button (red, as the title's buttons), then the
         game status, one short line. */
      #topleft {
        position: absolute;
        top: 12px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      /* On a phone the status line sits low beside Menu, under the name box. */
      @media (max-width: 600px) {
        #topleft {
          align-items: flex-end;
        }
      }
      #hud {
        color: #fff;
        /* Scales down on narrow phones so it never reaches the name box. */
        font-size: clamp(16px, 4.2vw, 24px);
        line-height: 1.2;
        max-width: calc(50vw - 20px);
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        user-select: none;
      }
      #hud:empty {
        display: none;
      }
      /* Each apple's name, under it (positioned by royale.js). */
      #names {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #names div {
        position: absolute;
        left: 0;
        top: 0;
        color: #fff;
        font-size: 18px;
        white-space: nowrap;
        text-shadow: 0 2px 0 #000, 0 0 4px #000;
        transform: translate(-50%, 0);
        will-change: transform;
      }
      #names div.me {
        color: #ffd23f;
        z-index: 1;
      }
      /* Bots: faded grey, so white means a real player. */
      #names div.bot {
        color: #d0d0d0;
        opacity: 0.55;
      }
      /* Top right: your name (editable any time), then the lobby buttons. */
      #topright {
        position: absolute;
        transition: top 0.3s;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      #name {
        width: 7em;
        max-width: calc(50vw - 40px);
        font: inherit;
        /* 16px at least: iOS zooms the page into any smaller input. */
        font-size: clamp(16px, 3.8vw, 18px);
        color: #fff;
        text-align: right;
        background: rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        padding: 4px 8px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #name:focus {
        border-color: #fff;
      }
      #name::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }
      /* The lobby's buttons ("Menu", "Start now"). Not part of #hud, which
         ignores pointers so taps reach the action button. */
      #bar {
        display: none;
        max-width: calc(100vw - 24px);
        text-align: right;
        font-size: clamp(13px, 3.6vw, 18px);
        line-height: 1.2;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      #bar span {
        display: inline-block;
        margin-left: 4px;
        padding: 6px 8px;
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.7);
        background: rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      #bar span.on {
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        font-weight: 700;
      }
      #banner {
        position: absolute;
        top: 36%;
        left: 0;
        right: 0;
        text-align: center;
        color: #fff;
        font-size: 44px;
        line-height: 1.2;
        text-shadow: 0 3px 0 #000, 0 0 10px rgba(0, 0, 0, 0.7);
        pointer-events: none;
        user-select: none;
        display: none;
      }
      /* The title menu, under the 3D logo (royale.js TitleScreen): two
         sections, each a caption over a pair of buttons. Multiplayer is Apple
         Royale, Local or Online (red); Single player is Apple Toss and Apple
         Run (leaf green). */
      #title {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: min(420px, calc(100vw - 32px));
        flex-direction: column;
        gap: 12px;
        user-select: none;
        -webkit-user-select: none;
      }
      body.titlescreen #title {
        display: flex;
        animation: titleIn 0.7s ease-out both;
      }
      /* On the way back up to the title the menu's there to measure, unseen;
         it fades up into place as the title arrives. */
      body.arriving #title {
        display: flex;
        visibility: hidden;
      }
      @keyframes titleIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(14px);
        }
      }
      body.titlescreen #touch,
      body.falling #names {
        visibility: hidden;
      }
      #titlemsg {
        margin: 0;
        text-align: center;
        color: #fff;
        font-size: 18px;
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
      }
      #titlemsg:empty {
        display: none;
      }
      #title .play {
        display: flex;
        gap: 12px;
      }
      #title .play button {
        flex: 1;
        font: inherit;
        font-size: clamp(26px, 7vw, 34px);
        color: #fff;
        background: #d8262b;
        border: 3px solid #2a1208;
        border-radius: 14px;
        padding: 8px 0 6px;
        box-shadow: 0 5px 0 #2a1208;
        text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      #title .play button:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #2a1208;
      }
      #title .play small {
        display: block;
        font-size: 0.5em;
        opacity: 0.85;
      }
      #title .caption {
        margin: 0 0 -4px;
        text-align: center;
        color: #fff;
        font-size: clamp(16px, 4.4vw, 19px);
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
      }
      #title .caption ~ .caption {
        margin-top: 6px; /* the second section, a little apart */
      }
      /* Single player: as Royale's buttons (one line, as tall as their two),
         in leaf green. */
      #title .solo button {
        height: var(--menu-h);
        padding: 0;
        background: #4e8a37;
        border-color: #16300f;
        box-shadow: 0 5px 0 #16300f;
      }
      #title .solo button:active {
        box-shadow: 0 1px 0 #16300f;
      }
      #title .solo button.busy {
        opacity: 0.6; /* loading, the first time */
      }
      /* The bots, on the title: at the top, your name under them. */
      #tiers {
        display: none;
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 32px));
      }
      body.titlescreen #tiers {
        display: flex;
        animation: titleIn 0.7s ease-out both;
      }
      body.titlescreen #topright {
        top: 68px;
      }
      /* The solo games (toss.js, run.js), played on this page: their score
         top right, Toss's wind and distance, Run's message; Royale's own
         things hidden meanwhile. */
      #soloHud,
      #wind,
      #dist,
      #msg {
        display: none;
        color: #fff;
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      body.solo #soloHud,
      body.solo-toss #wind,
      body.solo-run #msg {
        display: block;
      }
      body.solo-toss #dist {
        display: flex;
        pointer-events: auto;
      }
      body.solo #hud,
      body.solo #topright,
      body.solo #touch,
      body.solo #names,
      body.solo #banner {
        display: none;
      }
      #soloHud {
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: clamp(18px, 5vw, 26px);
      }
      /* Toss, down from the top, clear of where the apple flies: the distances,
         then Menu and the score, then the wind. */
      body.solo-toss {
        --toss-row: 68px; /* Menu's and the score's top, under the distances */
      }
      body.solo-toss #topleft {
        top: var(--toss-row);
      }
      body.solo-toss #soloHud {
        top: var(--toss-row);
        height: var(--menu-h);
        display: flex;
        align-items: center;
      }
      /* The wind: an arrow the way it blows (coloured by how hard, toss.js)
         and how hard, as in Paper Toss. */
      #wind {
        position: absolute;
        top: calc(var(--toss-row, 0px) + var(--menu-h) + 10px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(26px, 8vw, 40px);
      }
      #wind span {
        display: inline-block;
      }
      /* How far the basket is. */
      #dist {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 32px));
      }
      /* Run's what to do / how it went, mid-screen. */
      #msg {
        position: absolute;
        top: 30%;
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: clamp(22px, 6.5vw, 34px);
        line-height: 1.3;
        white-space: pre-line;
      }
      /* Touch controls — touch devices only: three equal buttons across the
         bottom (◀ ▶ and the action apple). A touch anywhere else on the game
         view is also the action button (see InputManager). */
      :root {
        --pad-gap: 14px;
        --pad-h: min(calc((100vw - 4 * var(--pad-gap)) / 3), 24vh);
      }
      #touch {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        gap: var(--pad-gap);
        padding: 0 var(--pad-gap) 8px; /* close to the bottom of the screen */
        pointer-events: none;
      }
      #touch button {
        position: relative; /* drawn over the stem */
        flex: 1;
        min-width: 0; /* else Safari keeps each button as wide as its leaf image (431px) */
        height: var(--pad-h);
        border: 0;
        padding: 0;
        background: none;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      /* The arrows are your apple's own leaves (rendered by royale.js);
         a held one grows a little more. */
      #touch button .leaf {
        display: block;
        width: 100%;
        height: 100%;
        /* On the bottom edge (the picture has next to no margin below). */
        background: center bottom / contain no-repeat;
        transform: scale(1.2); /* a bit bigger than the button; its margin is transparent */
        transform-origin: center bottom;
        transition: transform 80ms ease-out;
        pointer-events: none;
      }
      /* The stem between the leaves, from the bottom of the screen (placed by
         royale.js at the leaves' scale; its picture stretches lengthwise). */
      #stem {
        display: none;
        position: absolute;
        bottom: 0;
        background: center / 100% 100% no-repeat;
        pointer-events: none;
      }
      #touch button.down .leaf {
        transform: scale(1.32); /* 1.1× when held */
      }
      /* Tilt steering on: the leaf arrows (and their stem) go; the apple stays. */
      body.tilt #touch [data-code],
      body.tilt #stem {
        visibility: hidden;
      }
      /* ?debug: the sizes the browser is really using (phone layout checks). */
      #debug {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        z-index: 10;
        color: #ff0;
        background: rgba(0, 0, 0, 0.75);
        font: 13px/1.35 monospace;
        padding: 6px 8px;
        white-space: pre;
        pointer-events: none;
      }
      #action {
        position: relative;
        overflow: visible;
      }
      /* Your apple (a picture, royale.js), feet on the button's bottom edge,
         squashed and stretched from there; free to rise above the button. */
      #actionApple {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom;
        transform-origin: 50% 100%;
        pointer-events: none; /* presses go to the button */
      }
      #actionApple:not([src]) {
        visibility: hidden;
      }
      /* Only where the touch bar's pictures are rendered, once, then gone. */
      #action canvas {
        position: absolute;
        width: 64px;
        height: 64px;
        visibility: hidden;
      }
      /* Buttons or tilt: on touch screens, in Royale's lobbies and rounds, at
         the top as Toss's distances are, Menu, the status and your name
         under it. */
      #controls {
        display: none;
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        width: min(260px, calc(100vw - 32px));
      }
      @media (hover: none) and (pointer: coarse) {
        #touch {
          display: flex;
        }
        body:not(.titlescreen):not(.solo) #controls:not(:empty) {
          display: flex;
        }
        body:not(.titlescreen):not(.solo) #topleft,
        body:not(.titlescreen):not(.solo) #topright {
          top: 68px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="names"></div>
    <div id="topleft">
      <button id="menuBtn" class="menu-button" data-act="menu" hidden>Menu</button>
      <div id="hud"></div>
    </div>
    <div id="topright">
      <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" aria-label="Your name" />
      <div id="bar"></div>
    </div>
    <div class="radio" id="tiers" role="radiogroup" aria-label="Bots"></div>
    <div class="radio" id="controls" role="radiogroup" aria-label="Controls"></div>
    <div id="banner"></div>
    <div id="title">
      <p id="titlemsg"></p>
      <p class="caption">Multiplayer · Apple Royale</p>
      <div class="play">
        <button data-act="local">Local<small>vs bots</small></button>
        <button data-act="online">Online<small>vs players</small></button>
      </div>
      <p class="caption">Single player</p>
      <div class="play solo">
        <button data-act="toss">Apple Toss</button>
        <button data-act="run">Apple Run</button>
      </div>
    </div>
    <div id="soloHud"></div>
    <div id="wind"></div>
    <div id="dist" class="radio" role="radiogroup" aria-label="Distance"></div>
    <div id="msg"></div>
    <div id="touch">
      <!-- Filled with your apple's leaves and stem once they're rendered (royale.js). -->
      <div id="stem"></div>
      <button data-code="ArrowLeft" aria-label="Move left"></button>
      <button data-code="ArrowRight" aria-label="Move right"></button>
      <button id="action" aria-label="Jump / pound">
        <img id="actionApple" alt="" />
        <canvas id="actionCanvas"></canvas>
      </button>
    </div>

    <script>
      // Fit the page to exactly what's visible. On iOS Safari the layout
      // viewport can be bigger than the screen (under the floating toolbar)
      // or panned/zoomed, cutting off edges; the visual viewport is what you
      // actually see, so the page is sized and placed on it.
      (function () {
        const vv = window.visualViewport;
        if (!vv) return;
        const fit = () => {
          const s = document.body.style;
          s.left = vv.offsetLeft + "px";
          s.top = vv.offsetTop + "px";
          s.width = vv.width + "px";
          s.height = vv.height + "px";
          s.right = s.bottom = "auto";
          window.dispatchEvent(new Event("resize")); // the game re-fits its canvas
        };
        let queued = false;
        const later = () => {
          if (queued) return;
          queued = true;
          requestAnimationFrame(() => {
            queued = false;
            fit();
          });
        };
        vv.addEventListener("resize", later);
        vv.addEventListener("scroll", later);
        fit();
      })();
      // ?debug: show viewport / zoom / element edges, for phone layout checks.
      if (new URLSearchParams(location.search).has("debug")) {
        const box = document.createElement("div");
        box.id = "debug";
        document.body.appendChild(box);
        const r = (sel) => {
          const el = document.querySelector(sel);
          if (!el) return "-";
          const b = el.getBoundingClientRect();
          return `${Math.round(b.left)},${Math.round(b.top)} → ${Math.round(b.right)},${Math.round(b.bottom)}`;
        };
        setInterval(() => {
          const v = window.visualViewport || {};
          box.textContent = [
            `screen ${screen.width}x${screen.height}  dpr ${devicePixelRatio}`,
            `inner ${innerWidth}x${innerHeight}`,
            `client ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`,
            `visual ${Math.round(v.width)}x${Math.round(v.height)} scale ${(v.scale || 0).toFixed(3)}`,
            `visual offset ${Math.round(v.offsetLeft)},${Math.round(v.offsetTop)}  page ${Math.round(v.pageLeft)},${Math.round(v.pageTop)}`,
            `scroll ${scrollX},${scrollY}  docW ${document.documentElement.scrollWidth}`,
            `body   ${r("body")}`,
            `canvas ${r("#renderCanvas")}`,
            `hud    ${r("#hud")}`,
            `touch  ${r("#touch")}`,
          ].join("\n");
        }, 250);
      }
      // Long press: no selection or context menu (some browsers ignore the CSS).
      // (The name box still takes text.)
      for (const ev of ["selectstart", "contextmenu"]) {
        document.addEventListener(ev, (e) => {
          if (e.target.tagName !== "INPUT") e.preventDefault();
        });
      }
    </script>
    <!-- The engine, from npm (`npm install`; deploy.sh uploads these files). -->
    <script src="node_modules/babylonjs/babylon.js"></script>
    <script src="node_modules/babylonjs-loaders/babylonjs.loaders.min.js"></script>
    <script src="sliceBurst.js"></script>
    <script src="common.js"></script>
    <script src="logo.js"></script>
    <script src="grass.js"></script>
    <script src="core.js"></script>
    <script src="wire.js"></script>
    <script src="net.js"></script>
    <script src="bots.js"></script>
    <script src="toss.js"></script>
    <script src="run.js"></script>
    <script src="royale.js"></script>
  </body>
</html>
