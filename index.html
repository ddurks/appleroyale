<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale: no iOS zoom-in when the name box is focused -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>apple royale</title>
    <style>
      @font-face {
        font-family: "DrawvidHand";
        src: url("assets/fonts/DrawvidHandwriting.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        font-family: "DrawvidHand", "Comic Sans MS", cursive, sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      body {
        /* Pinned to the visible screen edges (no explicit height: on iOS
           Safari 100% / 100vh run on under the toolbar), and never scrolled
           (iOS scrolls the page to show a focused input). */
        position: fixed;
        inset: 0;
        width: auto;
        height: auto;
        background: url("./assets/appletreebg.png") center/cover no-repeat #000;
        /* No long-press text selection, callout menu or tap flash (iOS/Android). */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #renderCanvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
      }
      /* Game status, top left: one short line. */
      #hud {
        position: absolute;
        top: 12px;
        left: 14px;
        color: #fff;
        /* Scales down on narrow phones so it never reaches the name box. */
        font-size: clamp(16px, 4.2vw, 24px);
        line-height: 1.2;
        max-width: calc(50vw - 20px);
        text-shadow: 0 2px 0 #000, 0 0 6px rgba(0, 0, 0, 0.8);
        pointer-events: none;
        user-select: none;
      }
      #hud:empty {
        display: none;
      }
      /* Each apple's name, under it (positioned by royale.js). */
      #names {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #names div {
        position: absolute;
        left: 0;
        top: 0;
        color: #fff;
        font-size: 18px;
        white-space: nowrap;
        text-shadow: 0 2px 0 #000, 0 0 4px #000;
        transform: translate(-50%, 0);
        will-change: transform;
      }
      /* Top right: your name (editable any time), then the lobby buttons. */
      #topright {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      #name {
        width: 7em;
        max-width: calc(50vw - 40px);
        font: inherit;
        /* 16px at least: iOS zooms the page into any smaller input. */
        font-size: clamp(16px, 3.8vw, 18px);
        color: #fff;
        text-align: right;
        background: rgba(0, 0, 0, 0.35);
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        padding: 4px 8px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #name:focus {
        border-color: #fff;
      }
      #name::placeholder {
        color: rgba(255, 255, 255, 0.6);
      }
      /* Bot difficulty labels (lobby only; tap or press 1-4). Not part of
         #hud, which ignores pointers so taps reach the action button. */
      #difficulty {
        display: none;
        max-width: calc(100vw - 24px);
        text-align: right;
        font-size: clamp(13px, 3.6vw, 18px);
        line-height: 1.2;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      #difficulty span {
        display: inline-block;
        margin-left: 4px;
        padding: 6px 8px;
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.7);
        background: rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      #difficulty span.on {
        color: #fff;
        background: rgba(0, 0, 0, 0.65);
        font-weight: 700;
      }
      #banner {
        position: absolute;
        top: 36%;
        left: 0;
        right: 0;
        text-align: center;
        color: #fff;
        font-size: 44px;
        line-height: 1.2;
        text-shadow: 0 3px 0 #000, 0 0 10px rgba(0, 0, 0, 0.7);
        pointer-events: none;
        user-select: none;
        display: none;
      }
      /* Touch controls — touch devices only: three equal buttons across the
         bottom (◀ ▶ and the action apple). A touch anywhere else on the game
         view is also the action button (see InputManager). */
      :root {
        --pad-gap: 14px;
        --pad-h: min(calc((100vw - 4 * var(--pad-gap)) / 3), 24vh);
      }
      #touch {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        gap: var(--pad-gap);
        padding: 0 var(--pad-gap) calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #touch button {
        flex: 1;
        min-width: 0; /* else Safari keeps each button as wide as its leaf image (431px) */
        height: var(--pad-h);
        border: 0;
        padding: 0;
        background: none;
        color: rgba(255, 255, 255, 0.85);
        font: 700 calc(var(--pad-h) * 0.55) system-ui, sans-serif;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #touch button:active {
        color: #fff;
      }
      /* The arrows are your apple's own leaves (rendered by royale.js);
         a held one grows a little. */
      #touch button .leaf {
        display: block;
        width: 100%;
        height: 100%;
        background: center / contain no-repeat;
        transition: transform 80ms ease-out;
        pointer-events: none;
      }
      #touch button.down .leaf {
        transform: scale(1.1);
      }
      /* ?debug: the sizes the browser is really using (phone layout checks). */
      #debug {
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translateX(-50%);
        z-index: 10;
        color: #ff0;
        background: rgba(0, 0, 0, 0.75);
        font: 13px/1.35 monospace;
        padding: 6px 8px;
        white-space: pre;
        pointer-events: none;
      }
      #action {
        position: relative;
        overflow: visible;
      }
      #action canvas {
        /* Taller than the button (rising above it), so a full stretch or
           squash never crops. */
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 135%;
        pointer-events: none; /* presses go to the button */
      }
      @media (hover: none) and (pointer: coarse) {
        #touch {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="names"></div>
    <div id="hud"></div>
    <div id="topright">
      <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false" aria-label="Your name" />
      <div id="difficulty"></div>
    </div>
    <div id="banner"></div>
    <div id="touch">
      <button data-code="ArrowLeft" aria-label="Move left">◀</button>
      <button data-code="ArrowRight" aria-label="Move right">▶</button>
      <button id="action" aria-label="Jump / pound">
        <canvas id="actionCanvas"></canvas>
      </button>
    </div>

    <script>
      // ?debug: show viewport / zoom / element edges, for phone layout checks.
      if (new URLSearchParams(location.search).has("debug")) {
        const box = document.createElement("div");
        box.id = "debug";
        document.body.appendChild(box);
        const r = (sel) => {
          const el = document.querySelector(sel);
          if (!el) return "-";
          const b = el.getBoundingClientRect();
          return `${Math.round(b.left)},${Math.round(b.top)} → ${Math.round(b.right)},${Math.round(b.bottom)}`;
        };
        setInterval(() => {
          const v = window.visualViewport || {};
          box.textContent = [
            `screen ${screen.width}x${screen.height}  dpr ${devicePixelRatio}`,
            `inner ${innerWidth}x${innerHeight}`,
            `client ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`,
            `visual ${Math.round(v.width)}x${Math.round(v.height)} scale ${(v.scale || 0).toFixed(3)}`,
            `visual offset ${Math.round(v.offsetLeft)},${Math.round(v.offsetTop)}  page ${Math.round(v.pageLeft)},${Math.round(v.pageTop)}`,
            `scroll ${scrollX},${scrollY}  docW ${document.documentElement.scrollWidth}`,
            `body   ${r("body")}`,
            `canvas ${r("#renderCanvas")}`,
            `hud    ${r("#hud")}`,
            `touch  ${r("#touch")}`,
          ].join("\n");
        }, 250);
      }
      // Long press: no selection or context menu (some browsers ignore the CSS).
      // (The name box still takes text.)
      for (const ev of ["selectstart", "contextmenu"]) {
        document.addEventListener(ev, (e) => {
          if (e.target.tagName !== "INPUT") e.preventDefault();
        });
      }
    </script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="sliceBurst.js"></script>
    <script src="core.js"></script>
    <script src="net.js"></script>
    <script src="bots.js"></script>
    <script>
      // Default: multiplayer royale. Old demos stay reachable:
      //   ?demo=classic → single-player branch platformer (game.js)
      //   ?demo=3d      → 3D rolling sphere demo (game2.js)
      const params = new URLSearchParams(window.location.search);
      const demo = params.get("demo");
      const gameScript = document.createElement("script");
      gameScript.src =
        demo === "3d" ? "game2.js" : demo === "classic" ? "game.js" : "royale.js";
      document.body.appendChild(gameScript);
    </script>
  </body>
</html>
